<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenue</title>
  <style>
    :root {
      --bg: #faf7f2;
      --text: #1f1d1a;
      --muted: #6b655c;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171512;
        --text: #f3efe8;
        --muted: #a39b8f;
        --accent: #fb923c;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    .hello {
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0.5rem 0 1rem;
      font-size: clamp(2.2rem, 9vw, 4.5rem);
      font-weight: 400;
      line-height: 1.1;
    }
    p {
      max-width: 32rem;
      margin: 0 auto;
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="hello">Bienvenue</div>
    <h1>Melyssa</h1>
    <p>Bonjour et bienvenue sur ma page&nbsp;! Je suis ravie de vous accueillir ici. Installez-vous, prenez un café, et bonne visite.</p>
  </main>
</body>
</html>
